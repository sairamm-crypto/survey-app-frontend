name: Vite Frontend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (uses cache from package-lock.json for faster builds)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Run ESLint check (matches your eslint.config.js)
      - name: Run Linter
        run: npm run lint

      # 5. Build the Vite app (outputs to /dist)
      - name: Build project
        run: npm run build
        # Uncomment below if your app needs environment variables during build:
        # env:
        #   VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # 6. Upload the compiled 'dist' folder as a build artifact
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          
